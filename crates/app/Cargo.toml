[package]
name = "mailclient"
version.workspace = true
edition.workspace = true
build = "build.rs"

[lib]
name = "mailclient_app"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "mailclient"
path = "src/main.rs"

[features]
default = ["servo"]
# Render HTML mail with an embedded Servo webview. Without it, HTML is shown as plain text.
servo = ["dep:servo", "dep:surfman", "dep:gl", "dep:glow", "dep:gleam", "dep:image", "dep:winit", "dep:euclid", "dep:smol", "dep:url", "dep:http", "dep:thiserror", "dep:ash", "dep:gl_generator", "slint/unstable-winit-030", "slint/unstable-wgpu-30", "slint/renderer-femtovg-wgpu"]

[dependencies]
mailcore = { path = "../mailcore" }
anyhow.workspace = true
log.workspace = true
tokio.workspace = true
slint = { git = "https://github.com/slint-ui/slint", rev = "87b478eb388fb5ce66affa37617e4110c9081fdf" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

servo = { version = "=0.7.0", optional = true }
surfman = { version = "0.14.0", optional = true }
gl = { version = "0.14.0", optional = true }
glow = { version = "0.17.0", optional = true }
gleam = { version = "0.15.1", optional = true }
image = { version = "0.25.8", optional = true }
winit = { version = "0.30.12", optional = true }
euclid = { version = "0.22.11", optional = true }
smol = { version = "2.0.2", optional = true }
url = { version = "2.5.7", optional = true }
http = { version = "1.4", optional = true }
thiserror = { version = "2.0.17", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
ash = { version = "0.38.0", optional = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11"
open = "5"
rfd = "0.17"

[target.'cfg(target_os = "android")'.dependencies]
slint = { git = "https://github.com/slint-ui/slint", rev = "87b478eb388fb5ce66affa37617e4110c9081fdf", features = ["backend-android-activity-06"] }
android_logger = "0.15"
jni = "0.21"
ndk-context = "0.1"

[dev-dependencies]
i-slint-backend-testing = { git = "https://github.com/slint-ui/slint", rev = "87b478eb388fb5ce66affa37617e4110c9081fdf" }
futures = "0.3"
tempfile = "3"

[build-dependencies]
slint-build = { git = "https://github.com/slint-ui/slint", rev = "87b478eb388fb5ce66affa37617e4110c9081fdf" }
gl_generator = { version = "0.14.0", optional = true }

[package.metadata.android]
package = "dev.mailclient.app"
build_targets = ["x86_64-linux-android", "aarch64-linux-android"]
# Debug symbols would make the APK ~400 MB.
strip = "strip"

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 35

[package.metadata.android.application]
label = "Mail"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"
