[workspace]
resolver = "3"
members = ["crates/mailcore", "crates/app", "crates/e2e"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
log = "0.4"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }

[profile.dev.package."*"]
# Servo/SpiderMonkey are unusably slow unoptimized.
opt-level = 2
