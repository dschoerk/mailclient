# Tests and builds on every push to main and every pull request. A tag `v*` also builds release
# binaries and publishes them as a GitHub release: Linux x86_64 tarball and an Android arm64 APK.
# Release APKs are signed with the secrets ANDROID_KEYSTORE_BASE64 (base64 of the .jks) and
# ANDROID_KEYSTORE_PASS; the same key must sign every release, or phones refuse the update.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for every job; the release job asks for more itself.
permissions:
  contents: read

# Third-party actions are pinned to a commit: a moved tag can't run new code next to the signing key.
env:
  CARGO_TERM_COLOR: always
  # Debug info for Servo/SpiderMonkey fills the runner's disk.
  CARGO_PROFILE_DEV_DEBUG: 0
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake python3 m4 gperf pkg-config \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libx11-dev libxcb1-dev libxkbcommon-dev \
            libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libvulkan-dev libudev-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # mailcore only so far: the app crate still has warnings to clear first.
      - run: cargo clippy -p mailcore --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Sync engine against GreenMail
        run: |
          scripts/test-mailserver.sh
          cargo test -p mailcore --test greenmail -- --ignored
      - name: Release build
        if: env.RELEASE == 'true'
        run: |
          cargo build --release -p mailclient
          tar -czf mailclient-${{ github.ref_name }}-linux-x86_64.tar.gz -C target/release mailclient
      - if: env.RELEASE == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux
          path: mailclient-*.tar.gz

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >>"$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: command -v cargo-apk || cargo install cargo-apk --version 0.10.0 --locked
      - name: Debug APK
        if: env.RELEASE != 'true'
        run: scripts/build-android.sh --no-default-features --target aarch64-linux-android
      - name: Release APK
        if: env.RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          [[ -n "$KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASS" ]] || { echo "::error::set the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASS secrets"; exit 1; }
          export ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
          base64 -d <<<"$KEYSTORE_BASE64" >"$ANDROID_KEYSTORE"
          scripts/build-android.sh --no-default-features --release --target aarch64-linux-android
          cp target/release/apk/mailclient_app.apk mailclient-${{ github.ref_name }}-android-arm64.apk
      - if: env.RELEASE == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          path: mailclient-*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Tag matches Cargo.toml version
        run: grep -q "^version = \"${GITHUB_REF_NAME#v}\"" Cargo.toml || { echo "::error::$GITHUB_REF_NAME does not match the workspace version in Cargo.toml"; exit 1; }
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes mailclient-*
        env:
          GH_TOKEN: ${{ github.token }}
